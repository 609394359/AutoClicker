# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library.
android.nonTransitiveRClass=true

# AndroidX: REQUIRED — all dependencies in this project (Compose, Lifecycle, Activity) are AndroidX.
android.useAndroidX=true

# NOTE (Gradle 9 deprecations removed):
#  - org.gradle.configureondemand=true          : deprecated in Gradle 9, removed in Gradle 10
#  - android.defaults.buildfeatures.buildconfig : removed in AGP 9; declare per-module instead
#    (app module already sets buildFeatures { buildConfig = true } explicitly)

# Suppress unsupported Kotlin/AGP version warning in IDE
kotlin.suppress.kotlin.version.check=true

# ----------------------------------------------------------------------------
# JDK selection for Gradle's own JVM
# ----------------------------------------------------------------------------
# By default Gradle uses whatever JDK your IDE has currently configured.
# If your IDE locks Gradle to JDK 25 but Gradle 9.2.0 only supports JDK 17-24,
# uncomment the line below to force Gradle to use a JDK 21/24 you have installed.
#
# Windows examples (note the double-backslash and forward-slash; ':' must be escaped):
#   org.gradle.java.home=C\\:/Program Files/Java/jdk-21
#   org.gradle.java.home=C\\:/Program Files/Java/jdk-24
# macOS / Linux examples:
#   org.gradle.java.home=/Library/Java/JavaVirtualMachines/zulu-21.jdk/Contents/Home
#   org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64
# ----------------------------------------------------------------------------
# org.gradle.java.home=C\\:/Program Files/Java/jdk-21

